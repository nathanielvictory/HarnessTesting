[project]
name = "harness"
version = "0.1.0"
description = "Local workflow harness for LLM-assisted software development"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "mcp>=2,<3",
    "pydantic-ai-harness[coder]==0.71.0",
    "pydantic-ai-slim[openai]",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn",
]

[project.scripts]
harness = "harness.cli:main"
harness-api = "harness.api.server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
