[project]
name = "harness-test"
version = "0.1.0"
description = "Local workflow harness for LLM-assisted software development"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic-ai-harness[coder]==0.71.0",
    "pydantic-ai-slim[openai]",
    "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
harness = "harness_test.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
